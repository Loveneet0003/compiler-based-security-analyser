name: CI & Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build extension and test harness
      run: npm run build

    - name: Run Security Analyzer CLI Test Suite
      run: npm test

    - name: Generate SARIF Security Report
      run: node test-cli.js --sarif --exit-zero > security-report.sarif

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: security-report.sarif
      continue-on-error: true
